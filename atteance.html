<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Generator - AIML A</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --neon-cyan: #00f2fe;
      --neon-purple: #9d4edd;
      --neon-pink: #ff007f;
      --glass-bg: rgba(18, 24, 38, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 20% 20%, #1e112a 0%, #0a0f1d 50%, #020617 100%);
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      box-sizing: border-box;
      color: var(--text-main);
      text-align: center;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 24px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.3));
    }

    /* Glassmorphism Card */
    #main {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--glass-border);
      background-color: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 500;
      color: var(--neon-cyan);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:focus {
      outline: none;
      border-color: var(--neon-cyan);
      background-color: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
    }

    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: -4px 0 24px 0;
      text-align: left;
      font-style: italic;
    }

    /* Cyber Button Styling */
    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.25s ease;
      flex: 1;
      min-width: 120px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 198, 255, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid var(--glass-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      transform: translateY(-2px);
    }

    .btn-success {
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: #052e16;
      box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 239, 125, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    /* Glowing Output Card */
    #paa {
      display: none;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 20px;
      text-align: left;
      padding: 24px;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #e2e8f0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 242, 254, 0.1);
    }

    #paa b {
      color: var(--neon-cyan);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AIML - A</h1>

    <div id="main">
      <div class="input-group">
        <label for="abs">ROLL NO OF ABSENTEES:</label>
        <input type="text" id="abs" placeholder="e.g. 1, 2, 3">
      </div>

      <div class="input-group">
        <label for="od">ROLL NO OF ON-DUTY STUDENTS:</label>
        <input type="text" id="od" placeholder="e.g. 4, 5">
      </div>

      <div class="hint">***Give input as comma separated values (Eg: 1,2,3)***</div>

      <div class="button-group">
        <button class="btn-primary" onclick="clickk()">GET RESULT</button>
        <button class="btn-secondary" onclick="window.location.reload();">RESET</button>
        <button class="btn-success" onclick="copyt()">COPY</button>
      </div>
    </div>

    <div id="paa"></div>
  </div>

  <script>
    let abs = document.getElementById("abs");
    let b = document.getElementById("paa");
    let od = document.getElementById("od");

    const rn = {
      "1":"AAKASH.B","2":"AAKASH.J","4":"ABISHEK M","5":"ADARSH MENON","6":"AISHWARYA D","7":"AJAY MENAN M","8":"AKSHITHA B","9":"ASHWANT S","10":"ASWIN M","11":"BALA SRIDHAR P","12":"BALAKRISHNA R","13":"BHARANIDHARAN G","14":"BLESSY HANNAH K J","15":"BOOPATHI V","16":"BRINDHA S","17":"DAKSHATA M","18":"DARSHINI SP","19":"DASARTH S J","20":"DEEKSHANA A","21":"DEEPAK A","22":"DHANUSH J","23":"DHANUSHITH P","24":"DHANUSHYA B","25":"DHARNISH M.P","26":"DHARSAN S","27":"DHARSHANA AV","28":"DHARSHINI A","29":"DHEEPANA KN","30":"DILIP P","31":"DIVYA N K","32":"DIVYA DHARSHINI G","33":"FRANCIS KEVIN S","34":"GANESH K","35":"GIRIDHARAN V R","36":"GOKULSANKAR V","37":"GOWTHAM KUMAR M","38":"HARINI M","39":"HARINI V","40":"HARISH GOKUL S","41":"HASINI S","42":"HIRISHIKESH G","43":"ISANTH KANNA S","44":"JAI NIRUDHESH KM","45":"JAMUNA A","46":"JANASRUTHI S","47":"JAYASREE.M","48":"JEENATH G","49":"JEGATHESHWARAN.K","50":"JINESH R","51":"KAILASH S","52":"KARTHIKEYAN K","53":"KAVIYA A","54":"KAVIYADHARSHINI.S","55":"KAVYA R","56":"KIRTHIKA M","57":"KIRUTHIC G","58":"KISHANTH S.L","59":"KISHOR SRE","60":"KOUSHAL KUMAR","61":"KRUTHIK PRANAV T R","62":"LAKSHMANAPRABHU G","63":"LAVANYA R","64":"MADHAN KUMAR J","501":"PRAKASHPATHY"
    };

    function clickk() {
      let c = abs.value.trim();
      let d = od.value.trim();

      let arrab = c ? c.split(',').map(item => item.trim()) : [];
      let arrod = d ? d.split(',').map(item => item.trim()) : [];

      let lab = arrab.length;
      let lod = arrod.length;

      let pr = 64 - lab - lod;
      let pc = (pr / 64) * 100;
      let npc = Math.round(pc);

      let result = arrab.map(key => rn[key] || "Unknown");
      let resod = arrod.map(key => rn[key] || "Unknown");

      const da = new Date();
      const fd = da.toLocaleDateString('en-GB');

      // Check if current hour is 12:00 PM or later
      const session = da.getHours() >= 12 ? '(AN)' : '(FN)';

      b.style.display = "block";
      b.innerHTML = "";
      
      b.innerHTML += `${fd}${session}<br>`;
      b.innerHTML += `II AIML - A<br>`;
      b.innerHTML += `TOTAL STUDENTS ON-ROLL: 64<br>`;
      b.innerHTML += `TODAY'S NUMBER OF PHYSICAL PRESENT: ${pr}<br>`;
      b.innerHTML += `NUMBER OF STUDENTS WITH PERMITTED ON-DUTY: ${lod}<br>`;
      b.innerHTML += `ATTENDANCE PERCENTAGE: ${npc}%<br><br>`;
      
      b.innerHTML += `<b>ABSENTEES (${lab}) :</b><br>`;
      if (lab !== 0) {
        for (let i in arrab) {
          let s = `${arrab[i]} - ${result[i]}`;
          b.innerHTML += `${s}<br>`;
        }
      } else {
        b.innerHTML += `Nil<br>`;
      }

      b.innerHTML += `<br><b>ON-DUTY STUDENTS (${lod}) :</b><br>`;
      if (lod !== 0) {
        for (let i in arrod) {
          let s = `${arrod[i]} - ${resod[i]}`;
          b.innerHTML += `${s}<br>`;
        }
      } else {
        b.innerHTML += `Nil<br>`;
      }
    }

    function copyt() {
      const copyText = document.getElementById("paa");
      if (copyText.style.display === "none" || !copyText.innerText) {
        alert("Please click 'GET RESULT' first!");
        return;
      }
      
      const t = copyText.innerText;
      navigator.clipboard.writeText(t).then(() => {
        alert("Attendance Report Copied!");
      }).catch(err => {
        fallbackCopyText(t);
      });
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        alert("Attendance Report Copied!");
      } catch (err) {
        alert("Failed to copy text");
      }
      document.body.removeChild(textArea);
    }
  </script>
</body>
</html>
